name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  check:
    name: Lint & verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax-check JavaScript
        run: |
          node --check app.js
          node --check tools.js
          node --check sw.js

      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"

      - name: Verify entry files exist
        run: |
          test -f index.html
          test -f styles.css
